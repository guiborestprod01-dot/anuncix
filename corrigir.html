<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corrigir anúncios — Anuncix</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%232B59FF'/><path d='M10.5 10.5l11 11M21.5 10.5l-11 11' stroke='white' stroke-width='3.6' stroke-linecap='round'/><circle cx='23' cy='23' r='3.2' fill='%23FF6A2B'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{--blue:#2B59FF;--blue-d:#1E44D6;--ink:#14171F;--gray:#5F6675;--line:#E7E9EE;--soft:#F5F6F8;--white:#fff;--bad:#E5484D;--ok:#14A06B}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--soft);color:var(--ink);font-family:"Figtree",system-ui,sans-serif;font-size:16px;line-height:1.5;padding-bottom:110px}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:6px}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
header.wrap{padding-block:20px;display:flex;justify-content:space-between;align-items:center}
.logo{display:inline-flex;align-items:center;gap:9px;font-weight:800;font-size:22px;letter-spacing:-.02em;text-decoration:none;color:var(--ink)}
.logo svg{width:32px;height:32px}
.back{font-weight:600;font-size:15px;text-decoration:none}
h1{font-size:clamp(28px,4vw,36px);line-height:1.1;letter-spacing:-.025em;margin:8px 0 8px}
.lead{color:var(--gray);margin:0 0 20px;max-width:36em}
.card{background:var(--white);border-radius:22px;padding:22px;margin-bottom:14px}
.load{text-align:center;padding:40px 22px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:16px auto 0;max-width:320px}
.bar i{display:block;height:100%;width:5%;background:var(--blue);border-radius:99px;transition:width .4s}
.muted{color:var(--gray)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.sel{font-size:15px;font-weight:600;background:none;border:0;color:var(--blue);cursor:pointer;font-family:inherit;padding:0}
.it{display:grid;grid-template-columns:28px 1fr;gap:14px;align-items:start}
.it input{width:22px;height:22px;margin-top:3px;accent-color:var(--blue)}
.it h3{font-size:16px;margin:0 0 10px;line-height:1.3}
.ch{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;font-size:14.5px;padding:10px 0;border-top:1px solid var(--line)}
.ch dt{color:var(--gray)}
.ch dd{margin:0}
.old{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px}
.new{color:var(--ok);font-weight:600}
details{font-size:14.5px}
summary{cursor:pointer;color:var(--blue);font-weight:600}
details p{white-space:pre-wrap;background:var(--soft);border-radius:12px;padding:12px;margin:8px 0 0}
.tag{display:inline-block;font-size:12.5px;font-weight:700;background:#FEF3E2;color:#B5650A;border-radius:99px;padding:2px 9px;margin-left:6px;vertical-align:middle}
.rest{font-size:15px}
.rest li{margin:4px 0}

.foot{position:fixed;left:0;right:0;bottom:0;background:var(--white);border-top:1px solid var(--line);padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
.foot .wrap{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:0}
.foot small{display:block;color:var(--gray);font-size:13.5px}
.foot b{font-size:26px;font-weight:800;letter-spacing:-.02em}
.btn{background:var(--blue);color:#fff;font:inherit;font-weight:700;font-size:17px;border:0;border-radius:14px;padding:15px 24px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--blue-d)}
.btn:disabled{background:#AFC0F7;cursor:default}

.pix{text-align:center}
.pix img{width:220px;height:220px;image-rendering:pixelated;margin:8px auto;display:block}
.copy{display:flex;gap:8px;margin:12px 0}
.copy input{flex:1;min-width:0;padding:12px;border:1.5px solid var(--line);border-radius:12px;font:inherit;font-size:13px;color:var(--gray)}
.copy button{border:0;background:var(--ink);color:#fff;border-radius:12px;padding:0 16px;font:inherit;font-weight:700;cursor:pointer}
.wait{display:inline-flex;align-items:center;gap:10px;color:var(--gray);font-weight:600}
.wait:before{content:"";width:14px;height:14px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--blue);animation:g 1s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
.res li{padding:8px 0;border-top:1px solid var(--line);list-style:none}
.res ul{padding:0;margin:10px 0 0}
.ok{color:var(--ok);font-weight:700}.no{color:var(--bad);font-weight:700}
@media (prefers-reduced-motion:reduce){.wait:before{animation:none}}
@media(max-width:520px){.ch{grid-template-columns:1fr}.foot b{font-size:22px}.btn{padding:14px 18px;font-size:16px}}
</style>
</head>
<body>
<header class="wrap">
  <a class="logo" href="./" aria-label="Anuncix, início"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#2B59FF"/><path d="M10.5 10.5l11 11M21.5 10.5l-11 11" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/><circle cx="23" cy="23" r="3.2" fill="#FF6A2B"/></svg>anuncix</a>
  <a class="back" id="voltar" href="./">Voltar ao relatório</a>
</header>
<main class="wrap" id="app">
  <div class="card load"><h1>Preparando as correções</h1><p class="muted">O Anuncix está lendo cada anúncio e escrevendo a versão corrigida.</p><div class="bar"><i id="pg"></i></div></div>
</main>
<div class="foot" id="foot" hidden>
  <div class="wrap">
    <div><small id="fq">0 anúncios</small><b id="fv">R$ 0,00</b></div>
    <button class="btn" id="go">Corrigir agora</button>
  </div>
</div>

<script>
const API = "https://pgxhfrkiitninpepppvb.supabase.co/functions/v1/anuncix";
const q = new URLSearchParams(location.search);
const id = /^[0-9a-f-]{36}$/.test(q.get("id") || "") ? q.get("id") : "";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const real = (v) => Number(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const guarda = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
let dados = null, escolhidos = new Set();

function falha(msg) {
  $("#foot").hidden = true;
  $("#app").innerHTML = `<div class="card load"><h1>Não deu certo</h1><p class="muted">${esc(msg)}</p><p><a href="relatorio.html?id=${id}">Voltar ao relatório</a></p></div>`;
}

async function iniciar() {
  if (!id) return falha("Link inválido. Abra a correção pelo seu relatório.");
  $("#voltar").href = `relatorio.html?id=${id}`;
  const pend = guarda.get("anuncix-pedido-" + id);
  if (pend) return acompanhar(pend);
  try { await fetch(`${API}/propor`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id }) }); }
  catch { return falha("Sem conexão. Tente de novo em instantes."); }
  esperarPropostas();
}

async function esperarPropostas() {
  try {
    dados = await (await fetch(`${API}/propostas?id=${id}`)).json();
  } catch { return setTimeout(esperarPropostas, 4000); }
  if (dados.erro) return falha(dados.erro);
  const total = dados.itens.length || 1, prontos = dados.itens.filter((i) => i.status !== "gerando").length;
  if ($("#pg")) $("#pg").style.width = Math.max(5, Math.round((prontos / total) * 100)) + "%";
  if (dados.status !== "pronto" && prontos < dados.itens.length) return setTimeout(esperarPropostas, 3000);
  mostrar();
}

function linhas(d, a) {
  let h = "";
  if (d.titulo) h += `<div class="ch"><dt>Título</dt><dd><span class="old">${esc(a.titulo)}</span><br><span class="new">${esc(d.titulo)}</span></dd></div>`;
  for (const x of d.atributos || []) h += `<div class="ch"><dt>${esc(x.nome)}</dt><dd>${x.antes ? `<span class="old">${esc(x.antes)}</span><br>` : `<span class="muted">vazio</span><br>`}<span class="new">${esc(x.valor)}</span></dd></div>`;
  if (d.descricao) h += `<div class="ch"><dt>Descrição</dt><dd><details><summary>Ver a nova descrição</summary><p>${esc(d.descricao)}</p></details></dd></div>`;
  return h;
}

function mostrar() {
  const props = dados.itens.filter((i) => i.status === "proposta");
  const resto = dados.itens.filter((i) => i.status !== "proposta");
  if (!props.length) {
    return falha("O Anuncix não encontrou nada que dê para corrigir sozinho com segurança. Os pontos do seu relatório (código da peça, compatibilidade e fotos) precisam ser preenchidos por você no Mercado Livre.");
  }
  escolhidos = new Set(props.map((p) => p.item_id));
  $("#app").innerHTML = `
    <h1>Confira as correções</h1>
    <p class="lead">Nada muda no Mercado Livre até você confirmar. Desmarque o que não quiser. Os ${dados.gratis ? dados.gratis + " primeiros saem de graça" : "anúncios custam R$ 0,99 cada"}.</p>
    <div class="top"><span class="muted">${props.length} ${props.length === 1 ? "anúncio" : "anúncios"} com correção pronta</span><button class="sel" id="todos">Desmarcar todos</button></div>
    ${props.map((p) => `<label class="card it"><input type="checkbox" checked data-id="${esc(p.item_id)}">
      <div><h3>${esc(p.antes.titulo)}${p.antes.vendidos ? `<span class="tag">título travado</span>` : ""}</h3>${linhas(p.depois, p.antes)}</div></label>`).join("")}
    ${resto.length ? `<div class="card rest"><b>${resto.length} ${resto.length === 1 ? "anúncio precisa" : "anúncios precisam"} de você</b>
      <p class="muted" style="margin:6px 0 0">Neles o problema é código da peça, compatibilidade ou fotos. O Anuncix não inventa esses dados, porque um código errado faz o comprador receber a peça errada. Corrija direto no Mercado Livre seguindo o relatório.</p></div>` : ""}`;
  document.querySelectorAll(".it input").forEach((c) => c.onchange = () => { c.checked ? escolhidos.add(c.dataset.id) : escolhidos.delete(c.dataset.id); somar(); });
  $("#todos").onclick = () => {
    const marcar = escolhidos.size === 0;
    document.querySelectorAll(".it input").forEach((c) => { c.checked = marcar; marcar ? escolhidos.add(c.dataset.id) : escolhidos.delete(c.dataset.id); });
    somar();
  };
  $("#foot").hidden = false;
  somar();
}

function somar() {
  const n = escolhidos.size, gratis = Math.min(n, dados.gratis || 0), v = (n - gratis) * dados.preco;
  $("#fq").textContent = `${n} ${n === 1 ? "anúncio" : "anúncios"}${gratis ? `, ${gratis} grátis` : ""}`;
  $("#fv").textContent = real(v);
  $("#go").disabled = !n;
  $("#go").textContent = n && v === 0 ? "Corrigir de graça" : "Pagar com Pix";
  if ($("#todos")) $("#todos").textContent = n ? "Desmarcar todos" : "Marcar todos";
}

$("#go").onclick = async () => {
  $("#go").disabled = true;
  try {
    const r = await fetch(`${API}/pedido`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id, itens: [...escolhidos] }) });
    const j = await r.json();
    if (!r.ok) { alert(j.erro || "Não deu para continuar."); $("#go").disabled = false; return; }
    guarda.set("anuncix-pedido-" + id, j.pedido);
    acompanhar(j.pedido, j);
  } catch { alert("Sem conexão. Tente de novo."); $("#go").disabled = false; }
};

async function acompanhar(pid, primeiro) {
  $("#foot").hidden = true;
  let p = primeiro;
  try { if (!p || p.status !== "aguardando") p = await (await fetch(`${API}/pedido?pid=${pid}`)).json(); }
  catch { return setTimeout(() => acompanhar(pid), 4000); }
  if (p.erro) { guarda.set("anuncix-pedido-" + id, ""); return falha(p.erro); }

  if (p.status === "aguardando") {
    if (!$("#pixbox")) {
      $("#app").innerHTML = `<div class="card pix" id="pixbox"><h1>Pague ${real(p.valor)} com Pix</h1>
        <p class="muted">Abra o app do seu banco e leia o QR Code, ou copie o código.</p>
        ${p.qr ? `<img alt="QR Code do Pix" src="data:image/png;base64,${p.qr}">` : ""}
        <div class="copy"><input readonly value="${esc(p.copia)}" aria-label="Código Pix copia e cola"><button id="cp">Copiar</button></div>
        <p class="wait" role="status">Esperando o pagamento</p>
        <p class="muted" style="font-size:14px">Assim que o Pix cair, as correções entram no Mercado Livre sozinhas. Pode deixar esta página aberta.</p></div>`;
      $("#cp").onclick = async () => { try { await navigator.clipboard.writeText(p.copia); $("#cp").textContent = "Copiado"; } catch { document.querySelector(".copy input").select(); } };
    }
    return setTimeout(() => acompanhar(pid), 4000);
  }
  if (p.status === "expirado" || p.status === "erro") {
    guarda.set("anuncix-pedido-" + id, "");
    $("#app").innerHTML = `<div class="card load"><h1>O Pix venceu</h1><p class="muted">Nenhuma cobrança foi feita e nada mudou nos seus anúncios.</p><p><button class="btn" onclick="location.reload()">Gerar outro Pix</button></p></div>`;
    return;
  }
  if (p.status === "pago" || p.status === "aplicando") {
    $("#app").innerHTML = `<div class="card load"><h1>Pagamento recebido</h1><p class="wait" role="status">Publicando as correções no Mercado Livre</p></div>`;
    return setTimeout(() => acompanhar(pid), 3000);
  }
  // aplicado
  guarda.set("anuncix-pedido-" + id, "");
  const res = p.resultado || [], ok = res.filter((x) => x.ok), no = res.filter((x) => !x.ok);
  $("#app").innerHTML = `<div class="card res"><h1>${ok.length ? "Pronto, anúncios corrigidos" : "Não deu para publicar"}</h1>
    <p class="muted">${ok.length} de ${res.length} ${res.length === 1 ? "anúncio corrigido" : "anúncios corrigidos"} no Mercado Livre. Pode levar alguns minutos para aparecer no anúncio.</p>
    <ul>${res.map((x) => `<li>${x.ok ? `<span class="ok">Corrigido</span> ${esc(x.item)}: ${esc((x.feito || []).join(", "))}` : `<span class="no">Não publicado</span> ${esc(x.item)}: o Mercado Livre recusou a mudança.`}</li>`).join("")}</ul>
    ${no.length ? `<p class="muted">Nos anúncios recusados nada foi alterado.</p>` : ""}
    <p><a href="relatorio.html?id=${id}">Voltar ao relatório</a></p></div>`;
}

iniciar();
</script>
</body>
</html>
